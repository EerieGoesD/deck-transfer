[package]
name = "deck-transfer"
version = "1.0.5"
description = "Transfer files from PC to Steam Deck over ethernet"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
# On Windows, libssh2 defaults to the WinCNG crypto backend, which does NOT
# support ed25519 host keys or curve25519 key exchange - exactly what modern
# Steam Decks (OpenSSH 10+) require. These features rebuild libssh2 against a
# vendored OpenSSL (built from source), which supports both, so the handshake
# succeeds. openssl-on-win32 flips the backend; vendored-openssl supplies OpenSSL.
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
network-interface = "2"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
open = "5"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Mac App Store free trial and one-time unlock (StoreKit 2).
tauri-plugin-iap = "0.9"
# Remembers the window's size and position between launches.
tauri-plugin-window-state = "2"
# CPU and memory readout for this app's own process.
libc = "0.2"
# Wi-Fi or wired: which network ports the scan uses.
system-configuration = "0.7"
# Finds the Deck on a direct cable through IPv6 link-local addresses.
socket2 = "0.6"
# Keeps access to picked files and folders across launches (App Sandbox).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSString", "NSError"] }
base64 = "0.22"
